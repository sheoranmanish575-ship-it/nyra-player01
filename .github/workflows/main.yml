# Build, test, and package Nyra Player (Windows x64)
#
# FIXED vs the original workflow:
#   - The original workflow cloned and rebuilt the entire VLC source tree
#     via WSL2 + autotools, then located and uploaded "vlc.exe" - it never
#     invoked CMake, never touched Qt, and never built the Nyra Qt shell at
#     all. Its "smoke test" launched stock vlc.exe, not anything this
#     project produced. That is precisely the failure mode the brief
#     called out: "Do NOT create a workflow whose only useful output is
#     vlc.exe."
#   - This version runs natively on the windows-latest runner (no WSL2
#     needed), downloads VideoLAN's own published Windows SDK zip (public
#     headers + import libs + plugins, official and unmodified - see
#     BUILD.md "Option A"), installs Qt6 via the standard jurplel action,
#     configures/builds THIS repo's CMakeLists.txt, and verifies the
#     actual nyra.exe that comes out.
#
# NOTE (read before assuming this is "verified"): this workflow has been
# written carefully but has NOT been executed by the assistant that wrote
# it - that requires a real Windows runner, which the authoring sandbox
# does not have. Push this to GitHub and open the Actions tab to run it
# for real; check the run log and the "smoke-test" step output before
# trusting the artifact. See AUDIT.md / STATUS.md.

name: Build, test, and package Nyra Player (Windows x64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      vlc_sdk_url:
        description: 'URL of the VLC Windows SDK/dev zip to build against'
        required: false
        default: 'https://get.videolan.org/vlc/3.0.20/win64/vlc-3.0.20-win64.7z'

jobs:
  build:
    runs-on: windows-latest
    env:
      VLC_SDK_URL: ${{ github.event.inputs.vlc_sdk_url || 'https://get.videolan.org/vlc/3.0.20/win64/vlc-3.0.20-win64.7z' }}
    steps:
      - name: Checkout Nyra sources
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: 'win64_mingw'
          host: 'windows'
          target: 'desktop'
          modules: ''

      - name: Download VLC Windows SDK (official, prebuilt, unmodified)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "$env:VLC_SDK_URL" -OutFile vlc.7z
          7z x vlc.7z -ovlc-extract
          $vlcDir = Get-ChildItem vlc-extract -Directory | Select-Object -First 1
          Move-Item $vlcDir.FullName vlc-sdk
          # The SDK zip ships public headers under sdk/include and import
          # libs under sdk/lib - normalize to <root>/include and <root>/lib
          # so -DVLC_SDK_DIR points at one consistent layout.
          if (Test-Path vlc-sdk/sdk) {
            Copy-Item vlc-sdk/sdk/include vlc-sdk/include -Recurse -Force
            Copy-Item vlc-sdk/sdk/lib vlc-sdk/lib -Recurse -Force
          }
          Get-ChildItem vlc-sdk

      - name: Verify VLC SDK layout
        shell: pwsh
        run: |
          if (-not (Test-Path "vlc-sdk/include/vlc/vlc.h")) {
            Write-Error "vlc-sdk/include/vlc/vlc.h not found - SDK zip layout has changed, update this workflow's normalization step."
            exit 1
          }
          if (-not (Test-Path "vlc-sdk/plugins")) {
            Write-Error "vlc-sdk/plugins/ not found - packaged nyra.exe would have no codecs at runtime."
            exit 1
          }

      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -S . -B build -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DVLC_SDK_DIR="${{ github.workspace }}/vlc-sdk"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release -j

      - name: Verify nyra.exe was actually produced
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "nyra.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "nyra.exe was not produced by the build - failing rather than uploading nothing useful."
            exit 1
          }
          echo "NYRA_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          echo "Found: $($exe.FullName)"

      - name: Install / package (nyra.exe + Qt DLLs + VLC DLLs + plugins)
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist/Nyra

      - name: Verify the packaged folder is actually runnable-looking
        shell: pwsh
        run: |
          $dist = "dist/Nyra"
          $required = @("nyra.exe", "libvlc.dll", "Qt6Core.dll", "Qt6Widgets.dll", "Qt6Gui.dll")
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path (Join-Path $dist $f))) { $missing += $f }
          }
          if (-not (Test-Path (Join-Path $dist "plugins"))) { $missing += "plugins/" }
          if ($missing.Count -gt 0) {
            Write-Error "Missing required packaged files: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required files present in $dist"

      - name: Headless smoke test (process launches and exits cleanly)
        shell: pwsh
        run: |
          # This verifies nyra.exe actually starts under libvlc/Qt on a real
          # Windows runner and exits with code 0 on --version (no GUI
          # interaction required, so it works headlessly on the runner).
          # It does NOT verify real media playback - that needs either a
          # human, a UI-automation pass (not implemented here), or a
          # legal/public-domain test asset plus scripted key events, which
          # is tracked as a known gap - see STATUS.md.
          $exe = $env:NYRA_EXE
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) {
            Write-Error "nyra.exe --version exited with code $($p.ExitCode)"
            exit 1
          }
          Write-Host "nyra.exe launched and exited cleanly."

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Nyra/*" -DestinationPath "Nyra-Player-Windows-x64.zip"

      - name: Build NSIS installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DNYRA_BUILD_DIR="dist\Nyra" `
            installer\nyra-installer.nsi
        continue-on-error: true # installer is a nice-to-have; the portable zip above is the guaranteed artifact

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nyra-player-win64
          path: |
            Nyra-Player-Windows-x64.zip
            installer/Nyra-Player-Setup-Windows-x64.exe
          if-no-files-found: warn
